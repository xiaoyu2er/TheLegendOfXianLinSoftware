name: web

on:
  push:
    branches: [master]
    # 黄金测试读的是仓库根上的这三处：脚本源数据、冻结真值，以及段类型名单的
    # 出处 Reader.java。它们变了而这条流水线不跑，等于唯一那条客观判据在最该
    # 响的时候是哑的。两处名单一样，是抄的：YAML 锚点更短，但 Actions 认不认
    # 锚点这里没实测过，不在 CI 触发条件上冒这个险。
    #
    # 后面那几个素材目录是烘焙器的输入（xl-23y）：`bakeStamp.test.ts` 核的是
    # 「入库的产物是不是这批输入烘出来的」，素材换了而这条流水线不跑，那条
    # 判据就是哑的 —— 而且哑得不声不响：不触发的工作流在 PR 上没有红叉，
    # 跟跑过并通过长得一样。名单漏一个目录同样是这种哑法，所以它不靠人记：
    # `bakeStamp.test.ts` 拿指纹里的 703 个输入逐条问「这两行有没有 glob 罩得
    # 住它」。`tools/traces/out/**` 也在里面：走到过哪些场景决定烘哪几首 BGM。
    # `tools/random-golden/**` 是随机数复刻的黄金数据（xl-rh9.1）：它和
    # `tools/ground-truth/**` 同一个道理 —— 重导之后判据变了而这条流水线不跑，
    # 那条判据就是哑的，而哑的样子和绿的样子一模一样。`tools/traces/scripts/**`
    # 跟着一起进来：那条判据「黄金数据覆盖每一份剧本用的种子」的**分母是从剧本
    # 目录数出来的**，加一份带新种子的剧本而这里不跑，同样是哑的。
    paths: ['web/**', '.github/workflows/web.yml', 'script/**', 'tools/ground-truth/**', 'src/tools/Reader.java', 'tools/random-golden/**',
            'maps/**', 'heads/**', 'NPCs/**', 'roles/**', 'backImages/**', 'sources/**',
            'dialogue/**', 'tools/traces/out/**', 'tools/traces/scripts/**',
            'image/**']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml', 'script/**', 'tools/ground-truth/**', 'src/tools/Reader.java', 'tools/random-golden/**',
            'maps/**', 'heads/**', 'NPCs/**', 'roles/**', 'backImages/**', 'sources/**',
            'dialogue/**', 'tools/traces/out/**', 'tools/traces/scripts/**',
            'image/**']

# 只在 web/、黄金测试的输入、或本工作流自身变动时跑：Java 侧的其余改动
# 与这条流水线无关。
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile：lockfile 与 package.json 不一致时**失败**，
      # 而不是悄悄解析出一组别的版本 —— CI 装的必须是本地装的那一组。
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # 产物能不能静态部署，靠"它确实被生成了且资源路径是相对的"来判定，
      # 而不是靠 build 退出码为 0（空目录也能让 build 成功）。
      - name: 校验产物可静态部署
        run: |
          test -f dist/index.html
          grep -q 'src="\./assets/' dist/index.html
          test -n "$(ls dist/assets/*.js)"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
