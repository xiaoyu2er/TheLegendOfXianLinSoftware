name: java

on:
  # 手动触发。留着它有一个具体用途：这条工作流合并时**从没在真的 runner 上
  # 跑过**，而没有它就只能靠去改 paths 名单上的某个文件来验一次。
  workflow_dispatch:
  push:
    branches: [master]
    # 三样判据各自的输入都要在这张名单上，否则它们在最该响的时候是哑的 ——
    # 而**不触发的工作流在 PR 上没有红叉，跟跑过并通过长得一模一样**
    # （web.yml 的注释里记的是同一件事）。
    #
    # - src/**、tools/src/**、tools/test/**：单元测试与编译的直接输入。
    # - script/**：export-truth 读的就是这 96 个脚本；它们变了而真值没跟着变，
    #   正是 `git diff --exit-code` 该抓的那一刻。
    # - tools/ground-truth/**：冻结真值本身。有人手改了它而不重导，同上。
    # - image/**、sources/**：ReadImageWarningTest 从 image/ 下现扫一张真图，
    #   而 Reader 构造时会去读这两处的素材。
    # - 三个 jar 与 tools/*.sh：classpath 与跑法都写死在脚本里。
    paths: ['src/**', 'tools/src/**', 'tools/test/**', 'tools/build.sh', 'tools/test.sh',
            'tools/export-truth.sh', 'tools/ground-truth/**', 'script/**',
            'image/**', 'sources/**', '*.jar', '.github/workflows/java.yml',
            'tools/export-trace.sh', 'tools/traces/**']
  # 下面这份名单和上面那份逐字相同，是抄的，不是忘了去重。web.yml 里记了理由：
  # YAML 锚点更短，但 Actions 认不认锚点这个仓库没实测过，不在 CI 触发条件上
  # 冒这个险。两份漂移是静默的，改一份时另一份也要改。
  pull_request:
    paths: ['src/**', 'tools/src/**', 'tools/test/**', 'tools/build.sh', 'tools/test.sh',
            'tools/export-truth.sh', 'tools/ground-truth/**', 'script/**',
            'image/**', 'sources/**', '*.jar', '.github/workflows/java.yml',
            'tools/export-trace.sh', 'tools/traces/**']

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-java 会把 JAVA_HOME 设好，tools/*.sh 里那句
      # `: "${JAVA_HOME:=/opt/homebrew/…}"` 只在没设时才兜底，所以这里自然
      # 用的是 runner 上的 17。源码 targets JavaSE-1.7，17 编得过。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 全部命令从仓库根跑：原版把 script/、sources/、image/ 当相对路径读。
      - name: 编译
        run: tools/build.sh

      - name: 单元测试
        run: tools/test.sh

      # 数据层判据。**这两步必须分开**：export-truth.sh 自己成功只说明它跑完了，
      # 「跑出来的东西和入库的一样吗」是另一个问题，而后者才是判据。
      # --exit-code 是它变红的方式；没有它，diff 打印一屏差异然后 exit 0。
      - name: 重导 96 份解析真值
        run: tools/export-truth.sh

      - name: 真值必须无 diff
        run: git diff --exit-code -- tools/ground-truth

      # export-trace.sh --check 现在接上了，在下面那个**并行的 job** 里。
      # 为什么不放进这个 job：它 6 分钟，而上面这四步 44 秒。分成两个 job，
      # 快的那条先红 —— 编译挂了不必等六分钟才看见。

  # 行为层判据。xl-u7b 在真 runner 上量过才接的（run 35224054598，2026-09-17）：
  #
  #   不带 xvfb 跑一份 battle 剧本  → EXIT=1，跑不起来
  #   xvfb-run -a 跑同一份          → EXIT=0
  #   xvfb-run -a --check 全量       → EXIT=0，364 秒，确定性 OK 63 行、失败 0 行
  #   git diff -- tools/traces/out   → 0（runner 导出的与入库的逐字节一致）
  #
  # 那之前它一直没接，理由是用户 2026-09-08 的裁定「别拿一个没测过的东西堵 CI」——
  # 现在测过了。量具留在 .github/workflows/java-trace-probe.yml（只手动触发）。
  trace:
    runs-on: ubuntu-latest
    # 实测 job 总长 6m47s；给一倍余量，但别无限等。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ **xvfb 不是可选的**：export-trace.sh 写死 -Djava.awt.headless=false
      # （战斗驱动器要真的 Swing 组件），runner 上没有显示器，不套 xvfb 直接 EXIT=1。
      # ubuntu-latest 上 /usr/bin/xvfb-run 已预装；装不上要红，不许静默跳过。
      - name: 确认 xvfb 在
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }
          command -v xvfb-run >/dev/null || { echo "xvfb-run 装不上" >&2; exit 1; }

      # 这两步分开的理由与上面 export-truth 那一对**一模一样**，而且这里更要紧：
      # --check 只证明「这一趟跑出来的东西可复现」—— 一个**稳定的**错误在它眼里
      # 和正确一模一样。「导出来的和入库的一样吗」是另一个问题，下一步才是判据。
      - name: 重导全部行为真值（两遍，验确定性）
        run: xvfb-run -a tools/export-trace.sh --check

      - name: 行为真值必须无 diff
        run: git diff --exit-code -- tools/traces/out
